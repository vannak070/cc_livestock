<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0E7A38">
<title>CC Livestock - Offline</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F7F6F3;color:#1a1a1a;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center;padding:24px}
  main{max-width:360px}
  img{width:72px;height:72px;margin-bottom:16px}
  h1{font-size:1.4rem;margin:0 0 8px}
  p{margin:0 0 12px;line-height:1.5;color:#555}
  button{height:48px;padding:0 28px;border:0;border-radius:12px;background:#0E7A38;color:#fff;font-size:1rem;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>You are offline</h1>
  <p>CC Livestock needs an internet connection to load your farm records. Check your signal and try again.</p>
  <p lang="km">អ្នកគ្មានអ៊ីនធឺណិត។ សូមពិនិត្យការតភ្ជាប់ ហើយព្យាយាមម្ដងទៀត។</p>
  <button onclick="location.reload()">Try again / ព្យាយាមម្ដងទៀត</button>
</main>
</body>
</html>
