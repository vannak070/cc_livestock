# CC Livestock on the DigitalOcean droplet (157.245.148.58), production. Not the local-development compose file
# (that one is ../../docker-compose.yml and runs the Mac's database). Lives on the server in /opt/cc-livestock.
#
#   db       PostgreSQL 16, data in the `pgdata` volume, never published to the internet
#   app      farm app (Next.js, :3000) + REST API and schedulers (:3002), one container via pm2-runtime
#   website  CamCow public site (:3200); reads the snapshot and sends forms through app:3002/api/v1/site
#   caddy    the only public entry (:80/:443): www.camcow.com.kh -> website (camcow.com.kh forwards there),
#            digital.camcow.com.kh -> app
#
# Images are built on the Mac (see README.md) and loaded here; nothing is built on the small droplet.
#
# Hardening (2026-10-28): every container has no-new-privileges, capped logs and a memory cap (so one runaway process
# cannot starve the database on a 1 GB droplet); the two apps drop every Linux capability (they run as non-root users
# on ports above 1024); Caddy keeps only NET_BIND_SERVICE for :80/:443. Raise the memory caps after resizing.
# Networks: the database sits alone with the app on `backend`, which is internal (no internet, not reachable from the
# website or Caddy); the website and Caddy only ever talk to the app over `frontend`.
name: cc-livestock

x-logging: &logging
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    <<: *logging
    security_opt: [no-new-privileges:true]
    mem_limit: 320m
    networks: [backend]
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    image: cc-livestock-app:${APP_TAG:-latest}
    restart: unless-stopped
    <<: *logging
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 600m
    networks: [backend, frontend]
    env_file: .env
    environment:
      NODE_ENV: production
      # The app runs as the restricted account (rows only, scripts/db-role.sh); migrations use the owner (cc migrate).
      DB_USER: ${APP_DB_USER:?run cc db-role first}
      DB_PASSWORD: ${APP_DB_PASSWORD:?run cc db-role first}
      DB_HOST: db
      DB_PORT: 5432
      DB_SSL: "false"
      DB_POOL_MAX: 10
      WEBSITE_SNAPSHOT_DIR: /data/website-snapshot
    volumes:
      - snapshot:/data/website-snapshot
    depends_on:
      db:
        condition: service_healthy

  website:
    image: camcow-website:${WEBSITE_TAG:-latest}
    restart: unless-stopped
    <<: *logging
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 350m
    networks: [frontend]
    environment:
      NODE_ENV: production
      SITE_URL: ${SITE_URL}
      CAMCOW_API_URL: http://app:3002/api/v1/site
      CAMCOW_API_KEY: ${WEBSITE_API_KEY}
    volumes:
      - outbox:/data/outbox
    depends_on:
      # Start only when the app answers, so the website never makes pages without the farm data during a release.
      app:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    <<: *logging
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    mem_limit: 128m
    networks: [frontend]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
      - website

volumes:
  pgdata:
  snapshot:
  outbox:
  caddy_data:
  caddy_config:

networks:
  backend:
    internal: true
  frontend: {}
