# Pin the Compose project name so containers and the postgres_data volume keep
# their existing names (livestock_mgt-*) whatever this folder is called.
# Without it, renaming the folder would start a new, empty database.
name: livestock_mgt

# Local/dev Docker Compose for the Livestock Management System.
#
# NOTE ON CONTAINER NAMES: earlier versions of this file pinned fixed global
# container names (livestock_postgres_db / livestock_app_backend). Fixed
# names collide across unrelated projects on the same machine (Docker
# container names must be globally unique), which is exactly what happened
# here — this machine already had another project's Postgres container using
# that name. The names below are intentionally left unset so Compose falls
# back to its default project-scoped naming
# (<project>-db-1 / <project>-app-1, derived from this folder's name or
# COMPOSE_PROJECT_NAME), which can never collide with another project.
#
# If you already have a database container running locally for this project
# under the old fixed name, this file will no longer manage it — `docker
# compose up -d db` will create a NEW, separate, empty Postgres container
# instead of reusing it. Point DB_HOST/DB_PORT in .env at whichever instance
# actually holds the data you want to use.

services:
  # 1. PostgreSQL Relational Database Service
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
      POSTGRES_DB: ${DB_NAME:-cc_livestock}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Fresh volumes get the same numbered migrations the app uses; the
      # schema_migrations ledger is filled in by the first `npm run safe-migrate`.
      - ./src/db/migrations/sql:/docker-entrypoint-initdb.d:ro
    networks:
      - livestock_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-cc_livestock}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # 2. Livestock Backend & Next.js Application Service
  # Runs both processes via pm2-runtime (see Dockerfile + ecosystem.config.js):
  # backend API on 3002, Next.js frontend on 3000. Ports are fixed by
  # ecosystem.config.js, not by a PORT env var here, so none is set below.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
      - "3002:3002"
    environment:
      NODE_ENV: production
      CORS_ORIGIN: "*"
      # Use the Docker Compose service name 'db' as the database host
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres123}
      DB_NAME: ${DB_NAME:-cc_livestock}
      DB_SSL: "false"
      DB_POOL_MIN: 2
      DB_POOL_MAX: 20
      DB_IDLE_TIMEOUT_MS: 30000
      DB_CONN_TIMEOUT_MS: 5000
      # Required — no default on purpose. `docker compose up` fails fast
      # here instead of the container silently booting without auth working.
      # Set it in a .env file next to this compose file (already gitignored).
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your .env before running docker compose (see .env.example)}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - livestock_net

networks:
  livestock_net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
